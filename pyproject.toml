[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-ops-kpi-qa-pack"
version = "0.1.0"
description = "Healthcare operations KPI, data-quality, and reporting pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "openai>=2.0",
  "openpyxl>=3.1",
  "psycopg[binary]>=3.2",
  "xlsxwriter>=3.2",
  "streamlit>=1.44",
  "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
healthcare-ops-kpi-qa = "healthcare_ops_kpi_qa.main:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
